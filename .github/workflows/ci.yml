name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify rules.html matches rules/*.md
        if: matrix.node-version == '20.x'
        run: |
          node scripts/generate-rules-page.mjs
          git diff --exit-code site/rules.html || (echo "::error::site/rules.html is out of sync with rules/*.md — run 'node scripts/generate-rules-page.mjs' and commit" && exit 1)
