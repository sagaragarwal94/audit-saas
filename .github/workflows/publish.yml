name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Trusted publishing (OIDC) requires npm CLI >=11.5.1, which needs
      # Node >=22.14 -- newer than this project's own >=20 engines
      # requirement, but that's fine, this only affects the release job.
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # No NPM_TOKEN needed: this uses npm Trusted Publishing (OIDC), which
      # must be configured on the package's npmjs.com settings page first
      # (org/user, repo, workflow filename "publish.yml", allowed action
      # "npm publish") -- and that page only exists after the package has
      # been published at least once. See README's Releasing section.
      - name: Verify package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            const leaked = files.filter((f) => /^(test|site|audit-output|test-output)\//.test(f) || /(^|\/)\.env/.test(f) || f === ".auditsaas.json");
            if (leaked.length) { console.error("::error::Unexpected files in package: " + leaked.join(", ")); process.exit(1); }
            for (const required of ["bin/saas-audit.js", "src/cli.js", "rules/auth.md", ".claude/skills/audit-saas-review/SKILL.md"]) {
              if (!files.includes(required)) { console.error("::error::Missing from package: " + required); process.exit(1); }
            }
            console.log(files.length + " files OK");
          '

      - name: Publish to npm
        run: npm publish --access public
