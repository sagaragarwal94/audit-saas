name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release for the tag
      id-token: write   # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5

      # Trusted publishing (OIDC) requires npm CLI >=11.5.1, which needs
      # Node >=22.14 -- newer than this project's own >=20 engines
      # requirement, but that's fine, this only affects the release job.
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # Pinned to a major so a new npm release can't silently change CLI
      # output (npm 12 changed `pack --json` from an array to an object).
      - run: npm install -g npm@12

      - run: npm ci
      - run: npm test

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Verify package contents
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const data = require(process.argv[1]);
            // npm <=11 prints [ {...} ]; npm 12 prints { "<name>": {...} }.
            const entry = Array.isArray(data) ? data[0] : (data.files ? data : Object.values(data)[0]);
            const files = (entry?.files || []).map((f) => f.path);
            if (files.length === 0) { console.error("::error::Could not read file list from npm pack --json"); process.exit(1); }
            const leaked = files.filter((f) => /^(test|site|audit-output|test-output)\//.test(f) || /(^|\/)\.env/.test(f) || f === ".auditsaas.json");
            if (leaked.length) { console.error("::error::Unexpected files in package: " + leaked.join(", ")); process.exit(1); }
            for (const required of ["bin/saas-audit.js", "src/cli.js", "rules/auth.md", ".claude/skills/audit-saas-review/SKILL.md"]) {
              if (!files.includes(required)) { console.error("::error::Missing from package: " + required); process.exit(1); }
            }
            console.log(files.length + " files OK");
          ' "$RUNNER_TEMP/pack.json"

      # No NPM_TOKEN needed: this uses npm Trusted Publishing (OIDC), which
      # must be configured on the package's npmjs.com settings page first
      # (org/user, repo, workflow filename "publish.yml", allowed action
      # "npm publish") -- and that page only exists after the package has
      # been published at least once. See README's Releasing section.
      # Re-running the workflow for an already-published version is a no-op.
      - name: Publish to npm
        run: |
          PKG="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "$PKG is already on npm; skipping publish."
          else
            npm publish --access public
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest \
              --title "$GITHUB_REF_NAME" \
              --notes "Install: \`npx auditsaas@${GITHUB_REF_NAME#v} scan .\` · Full changelog: https://auditsaas.org/changelog"
          fi
